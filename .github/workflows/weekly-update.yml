name: Weekly Lotto Data Update

on:
  # 매주 토요일 22:00 KST = 13:00 UTC (추첨 후 1.5시간 여유)
  schedule:
    - cron: '0 13 * * 6'
  # 수동 트리거 (테스트용)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 데이터 커밋·푸시 권한
      issues: write     # 실패 시 issue 생성 권한

    steps:
      - name: Git Clone Repository (No actions/checkout)
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies & Playwright Chrome
        run: |
          npm ci
          npx playwright install --with-deps chrome

      - name: Diagnose dhlottery access (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
          (async () => {
            const { crawlDhLottery, closeBrowser } = require('./scripts/crawl-dhlottery.js');
            try {
              const r = await crawlDhLottery(1227);
              console.log('SUCCESS', r.numbers.join(','), '+', r.bonusNo, '(', r.date, ')');
            } catch (e) {
              console.error('FAILED:', e.message);
              process.exit(1);
            } finally {
              await closeBrowser();
            }
          })();
          "

      - name: Run update script
        timeout-minutes: 10   # 매달림 방지 — 정상 수집은 1~2분, 초과 시 빠르게 실패
        run: node scripts/update.js

      - name: Commit and push if changed
        run: |
          # 원격 저장소 최신 변경 사항 동기화
          git pull origin main --rebase
          
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: 주간 로또 데이터 자동 갱신 ($(date +%Y-%m-%d))"
          git push

      - name: Create issue on failure (No actions/github-script)
        if: failure() || cancelled()
        run: |
          node -e "
          (async () => {
            const https = require('https');
            const date = new Date().toISOString().split('T')[0];
            const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            
            const data = JSON.stringify({
              title: '⚠️ 주간 자동 갱신 실패 (' + date + ')',
              body: '## 자동 크롤링 실패\n\n실패한 워크플로우 로그를 확인해주세요.\n\n- **실패 일시**: ' + date + '\n- **로그 URL**: ' + runUrl
            });

            const options = {
              hostname: 'api.github.com',
              path: '/repos/${{ github.repository }}/issues',
              method: 'POST',
              headers: {
                'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}',
                'User-Agent': 'Node.js-Script',
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(data)
              }
            };

            const req = https.request(options, (res) => {
              console.log('Issue creation status:', res.statusCode);
            });
            req.on('error', (e) => {
              console.error('Failed to create issue:', e);
            });
            req.write(data);
            req.end();
          })();
          "
