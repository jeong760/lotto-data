name: Weekly Lotto Data Update

on:
  # Every Saturday at 22:00 KST = 13:00 UTC (1.5 hours after the draw)
  schedule:
    - cron: '0 13 * * 6'
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Permission to commit and push data updates
      issues: write     # Permission to create issues on failure

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # Updated to v4 (v6 does not exist)

      - name: Setup Node.js
        uses: actions/setup-node@v4   # Updated to v4 (v6 does not exist)
        with:
          node-version: '22'   # Current LTS

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome & Playwright Dependencies
        run: npx playwright install --with-deps chrome

      - name: Diagnose dhlottery access (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
          (async () => {
            const { crawlDhLottery, closeBrowser } = require('./scripts/crawl-dhlottery.js');
            try {
              const r = await crawlDhLottery(1227);
              console.log('SUCCESS', r.numbers.join(','), '+', r.bonusNo, '(', r.date, ')');
            } catch (e) {
              console.error('FAILED:', e.message);
              process.exit(1);
            } finally {
              await closeBrowser();
            }
          })();
          "

      - name: Run update script
        timeout-minutes: 10   # Prevent hanging — normal run takes 1-2 minutes, fails fast if exceeded
        run: node scripts/update.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "chore: Weekly automatic lotto data update ($(date +%Y-%m-%d))"
          git push

      - name: Create issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v7   # Updated to v7 (v9 does not exist)
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Weekly Auto-Update Failed (${date})`,
              body: `## Automatic Crawling Failed\n\nPlease check the failed workflow logs.\n\n- **Failure Date**: ${date}\n- **Log URL**: ${runUrl}\n\n## Potential Causes\n\n1. HTML structure changes on the DHLottery website (broken selectors)\n2. Temporary outage of the DHLottery website\n3. Network issues\n4. Gap is too large (10+ weeks)\n5. Script hanging / timeout due to unclosed browser processes (DECISIONS.md ADR-10)\n\n## Action Items\n\n1. Review the workflow logs to identify the exact error message\n2. Inspect the website HTML structure directly\n3. Update selectors in \`scripts/crawl-dhlottery.js\` if necessary\n4. Re-run the update script manually via the \`workflow_dispatch\` trigger`
            });
