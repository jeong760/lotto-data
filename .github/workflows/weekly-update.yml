name: Weekly Lotto Data Update

on:
  # 매주 토요일 22:00 KST = 13:00 UTC (추첨 후 1.5시간 여유)
  schedule:
    - cron: '0 13 * * 6'
  # 수동 트리거 (테스트용)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 데이터 커밋·푸시 권한
      issues: write     # 실패 시 issue 생성 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v6   # Node.js 24 native

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'   # 현 LTS

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Diagnose dhlottery access (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
          (async () => {
            const { crawlDhLottery, closeBrowser } = require('./scripts/crawl-dhlottery.js');
            try {
              const r = await crawlDhLottery(1227);
              console.log('SUCCESS', r.numbers.join(','), '+', r.bonusNo, '(', r.date, ')');
            } catch (e) {
              console.error('FAILED:', e.message);
              process.exit(1);
            } finally {
              await closeBrowser();
            }
          })();
          "

      - name: Run update script
        timeout-minutes: 10   # 매달림 방지 — 정상 수집은 1~2분, 초과 시 빠르게 실패
        run: node scripts/update.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: 주간 로또 데이터 자동 갱신 ($(date +%Y-%m-%d))"
          git push

      - name: Create issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 주간 자동 갱신 실패 (${date})`,
              body: `## 자동 크롤링 실패\n\n실패한 워크플로우 로그를 확인해주세요.\n\n- **실패 일시**: ${date}\n- **로그 URL**: ${runUrl}\n\n## 가능한 원인\n\n1. 동행복권 사이트 HTML 구조 변경 (셀렉터 깨짐)\n2. 동행복권 사이트 일시적 다운\n3. 네트워크 문제\n4. 갭이 너무 큼 (10주 이상)\n5. 스크립트가 매달려 타임아웃 (수집 후 프로세스 미종료 계열 — DECISIONS.md ADR-10)\n\n## 대응\n\n1. 로그 확인하여 정확한 에러 메시지 파악\n2. 사이트 직접 방문하여 HTML 구조 확인\n3. 필요시 \`scripts/crawl-dhlottery.js\` 셀렉터 수정\n4. 수동으로 update 스크립트 재실행: \`workflow_dispatch\` 트리거`
            });
